<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in - Chat</title>
<style>
:root{
  --bg:#eef2f5; --panel:#ffffff; --text:#18242d; --muted:#6b7c88;
  --accent:#1f7a8c; --line:#d5dee5; --focus:#f2a900; --error:#b3261e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f171d; --panel:#16222b; --text:#e6eef3; --muted:#8a9ba7;
    --accent:#2a95a9; --line:#26363f; --error:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#0f171d; --panel:#16222b; --text:#e6eef3; --muted:#8a9ba7;
  --accent:#2a95a9; --line:#26363f; --error:#ff8a80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);
  color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:16px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{margin:0 0 4px;font-size:1.5rem}
.sub{margin:0 0 22px;color:var(--muted)}
label{display:block;font-size:.9rem;margin-bottom:6px}
input{width:100%;padding:12px 14px;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
.link{all:unset;color:var(--accent);cursor:pointer;text-decoration:underline}
.link:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.switch{margin:18px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
.error{min-height:1.3em;margin:0 0 12px;color:var(--error);font-size:.9rem}
#confirmRow{display:none}
.note{margin:18px 0 0;font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1 id="title">Sign in</h1>
  <p class="sub" id="sub">Enter your details to open your chats.</p>

  <form id="form" novalidate>
    <label for="user">Username</label>
    <input id="user" type="text" autocomplete="username" required>

    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" required>

    <div id="confirmRow">
      <label for="pass2">Confirm password</label>
      <input id="pass2" type="password" autocomplete="new-password">
    </div>

    <p class="error" id="error" role="alert"></p>
    <button class="primary" id="submit" type="submit">Sign in</button>
  </form>

  <p class="switch">
    <span id="switchText">No account yet?</span>
    <button class="link" id="switchBtn" type="button">Create account</button>
  </p>
  <p class="note">Demo only: accounts are stored in this browser, not on a server.</p>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = "signin";

function getUsers(){
  try { return JSON.parse(localStorage.getItem("chatUsers") || "{}"); } catch(e){ return {}; }
}
function saveUsers(u){
  try { localStorage.setItem("chatUsers", JSON.stringify(u)); return true; } catch(e){ return false; }
}
async function hash(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function setMode(m){
  mode = m;
  const up = m === "signup";
  $("title").textContent = up ? "Create account" : "Sign in";
  $("sub").textContent = up ? "Choose a username and password." : "Enter your details to open your chats.";
  $("submit").textContent = up ? "Create account" : "Sign in";
  $("switchText").textContent = up ? "Already have an account?" : "No account yet?";
  $("switchBtn").textContent = up ? "Sign in" : "Create account";
  $("confirmRow").style.display = up ? "block" : "none";
  $("pass").autocomplete = up ? "new-password" : "current-password";
  $("error").textContent = "";
}

function fail(msg){ $("error").textContent = msg; }

$("switchBtn").onclick = () => setMode(mode === "signin" ? "signup" : "signin");

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  fail("");
  const user = $("user").value.trim();
  const pass = $("pass").value;
  if(!user || !pass) return fail("Enter a username and a password.");

  const users = getUsers();
  const key = user.toLowerCase();

  if(mode === "signup"){
    if(user.length < 3) return fail("Username must be at least 3 characters.");
    if(pass.length < 6) return fail("Password must be at least 6 characters.");
    if(pass !== $("pass2").value) return fail("Passwords do not match.");
    if(users[key]) return fail("That username is taken. Choose another.");
    users[key] = { name: user, hash: await hash(key + ":" + pass) };
    if(!saveUsers(users)) return fail("Could not save the account in this browser.");
  } else {
    const rec = users[key];
    if(!rec || rec.hash !== await hash(key + ":" + pass)) return fail("Wrong username or password.");
  }

  const name = users[key].name;
  try { sessionStorage.setItem("chatUser", name); } catch(err){ return fail("Could not start a session."); }
  location.href = "index.html";
});

// Already signed in? Skip the form.
try { if(sessionStorage.getItem("chatUser")) location.replace("index.html"); } catch(e){}
</script>
</body>
</html>
